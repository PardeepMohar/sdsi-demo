<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>URL Shortener</title>
  <style>
    :root {
      --bg: #0f172a; --card: #1e293b; --text: #f1f5f9;
      --muted: #94a3b8; --accent: #6366f1; --accent-hover: #818cf8;
      --border: #334155; --danger: #ef4444; --success: #22c55e;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg); color: var(--text);
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
    }
    .container { width: 100%; max-width: 640px; padding: 1rem; }
    .card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 12px; padding: 2rem;
    }
    h1 { font-size: 1.75rem; margin-bottom: 0.25rem; }
    .subtitle { color: var(--muted); margin-bottom: 1.5rem; font-size: 0.9rem; }
    .form-group { margin-bottom: 1rem; }
    label { display: block; margin-bottom: 0.35rem; font-size: 0.85rem; color: var(--muted); }
    input {
      width: 100%; padding: 0.7rem 0.85rem; border-radius: 8px;
      border: 1px solid var(--border); background: var(--bg); color: var(--text);
      font-size: 0.95rem; transition: border-color 0.15s;
    }
    input:focus { outline: none; border-color: var(--accent); }
    .row { display: flex; gap: 0.75rem; }
    .row > * { flex: 1; }
    button {
      width: 100%; padding: 0.75rem; border: none; border-radius: 8px;
      background: var(--accent); color: white; font-size: 1rem; font-weight: 600;
      cursor: pointer; transition: background 0.15s; margin-top: 0.5rem;
    }
    button:hover { background: var(--accent-hover); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .result {
      margin-top: 1.25rem; padding: 1rem; border-radius: 8px;
      border: 1px solid var(--border); display: none;
    }
    .result.show { display: block; }
    .result.success { border-color: var(--success); }
    .result.error { border-color: var(--danger); }
    .short-url { font-size: 1.1rem; word-break: break-all; }
    .short-url a { color: var(--accent-hover); text-decoration: none; }
    .copy-btn {
      margin-left: 0.5rem; padding: 0.25rem 0.6rem; font-size: 0.75rem;
      border-radius: 4px; background: var(--border); color: var(--text);
      border: none; cursor: pointer; width: auto; margin-top: 0;
    }
    .error-msg { color: var(--danger); }
    .stats-section { margin-top: 1.5rem; }
    .stats-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0.75rem; margin-top: 0.5rem; }
    .stat-tile {
      background: var(--bg); border-radius: 8px; padding: 0.75rem;
      text-align: center; border: 1px solid var(--border);
    }
    .stat-value { font-size: 1.5rem; font-weight: 700; color: var(--accent-hover); }
    .stat-label { font-size: 0.75rem; color: var(--muted); margin-top: 0.15rem; }
    .tabs { display: flex; gap: 0; margin-bottom: 1rem; }
    .tab {
      flex: 1; padding: 0.6rem; text-align: center; cursor: pointer;
      border: 1px solid var(--border); background: var(--bg); color: var(--muted);
      font-size: 0.85rem; font-weight: 500;
    }
    .tab:first-child { border-radius: 8px 0 0 8px; }
    .tab:last-child { border-radius: 0 8px 8px 0; }
    .tab.active { background: var(--accent); color: white; border-color: var(--accent); }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    .history-item {
      padding: 0.5rem 0; border-bottom: 1px solid var(--border);
      font-size: 0.85rem;
    }
    .history-item:last-child { border-bottom: none; }
    .history-item a { color: var(--accent-hover); }
  </style>
</head>
<body>
<div class="container">
  <div class="card">
    <h1>🔗 URL Shortener</h1>
    <p class="subtitle">Shorten, share, and track your links</p>

    <div class="tabs">
      <div class="tab active" data-tab="shorten">Shorten</div>
      <div class="tab" data-tab="stats">Stats</div>
    </div>

    <!-- Shorten Tab -->
    <div class="tab-content active" id="tab-shorten">
      <div class="form-group">
        <label for="url">URL to shorten</label>
        <input type="url" id="url" placeholder="https://example.com/very-long-path">
      </div>
      <div class="row">
        <div class="form-group">
          <label for="alias">Custom alias (optional)</label>
          <input type="text" id="alias" placeholder="my-link">
        </div>
        <div class="form-group">
          <label for="ttl">Expiry in hours (optional)</label>
          <input type="number" id="ttl" placeholder="24" min="1">
        </div>
      </div>
      <button id="shorten-btn">Shorten URL</button>
      <div class="result" id="shorten-result">
        <p class="short-url" id="shorten-output"></p>
        <p style="margin-top:0.5rem;color:var(--muted);font-size:0.8rem;" id="shorten-meta"></p>
      </div>
    </div>

    <!-- Stats Tab -->
    <div class="tab-content" id="tab-stats">
      <div class="form-group">
        <label for="stats-code">Short code</label>
        <input type="text" id="stats-code" placeholder="abc1234">
      </div>
      <button id="stats-btn">Get Stats</button>
      <div class="result" id="stats-result">
        <div class="stats-grid">
          <div class="stat-tile"><div class="stat-value" id="stat-total">—</div><div class="stat-label">Total Clicks</div></div>
          <div class="stat-tile"><div class="stat-value" id="stat-last">—</div><div class="stat-label">Last Accessed</div></div>
          <div class="stat-tile"><div class="stat-value" id="stat-created">—</div><div class="stat-label">Created</div></div>
          <div class="stat-tile"><div class="stat-value" id="stat-expires">—</div><div class="stat-label">Expires</div></div>
        </div>
        <p style="margin-top:0.75rem;font-size:0.85rem;color:var(--muted);">Destination: <span id="stat-url"></span></p>
      </div>
    </div>

    <!-- Recently Shortened -->
    <div style="margin-top:1.5rem" id="history-section">
      <h3 style="font-size:0.9rem;color:var(--muted);margin-bottom:0.5rem;">Recent</h3>
      <div id="history-list"></div>
    </div>
  </div>
</div>

<script>
const API = window.location.origin;
let history = JSON.parse(localStorage.getItem('url-history') || '[]');

function $(id) { return document.getElementById(id); }

// Tab switching
document.querySelectorAll('.tab').forEach(t => {
  t.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(x => x.classList.remove('active'));
    t.classList.add('active');
    $('tab-' + t.dataset.tab).classList.add('active');
  });
});

// Shorten
$('shorten-btn').addEventListener('click', async () => {
  const btn = $('shorten-btn');
  const result = $('shorten-result');
  result.classList.remove('show', 'success', 'error');
  btn.disabled = true; btn.textContent = 'Shortening...';

  const body = { url: $('url').value.trim() };
  const alias = $('alias').value.trim();
  const ttl = $('ttl').value.trim();
  if (alias) body.alias = alias;
  if (ttl) body.ttl_hours = parseInt(ttl);

  try {
    const r = await fetch('/shorten', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    const data = await r.json();
    if (r.ok) {
      const shortUrl = `${API}${data.short_url}`;
      $('shorten-output').innerHTML =
        `<a href="${shortUrl}" target="_blank">${shortUrl}</a>
         <button class="copy-btn" onclick="navigator.clipboard.writeText('${shortUrl}')">Copy</button>`;
      $('shorten-meta').textContent = data.expires_at ? `Expires: ${new Date(data.expires_at).toLocaleString()}` : 'No expiry';
      result.classList.add('success', 'show');
      addHistory(data.code, body.url);
    } else {
      $('shorten-output').innerHTML = `<span class="error-msg">${data.error}</span>`;
      $('shorten-meta').textContent = '';
      result.classList.add('error', 'show');
    }
  } catch (e) {
    $('shorten-output').innerHTML = `<span class="error-msg">Network error</span>`;
    result.classList.add('error', 'show');
  }
  btn.disabled = false; btn.textContent = 'Shorten URL';
});

// Stats
$('stats-btn').addEventListener('click', async () => {
  const code = $('stats-code').value.trim();
  const result = $('stats-result');
  result.classList.remove('show', 'success', 'error');
  if (!code) return;

  try {
    const r = await fetch(`/stats/${code}`);
    const data = await r.json();
    if (r.ok) {
      $('stat-total').textContent = data.total_clicks;
      $('stat-last').textContent = data.last_accessed
        ? new Date(data.last_accessed).toLocaleString()
        : 'Never';
      $('stat-created').textContent = new Date(data.created_at).toLocaleDateString();
      $('stat-expires').textContent = data.expires_at
        ? new Date(data.expires_at).toLocaleString() : 'Never';
      $('stat-url').textContent = data.url;
      result.classList.add('success', 'show');
    } else {
      $('stat-total').textContent = data.error;
      result.classList.add('error', 'show');
    }
  } catch (e) {
    $('stat-total').textContent = 'Error';
    result.classList.add('error', 'show');
  }
});

// History
function addHistory(code, url) {
  history.unshift({ code, url, time: Date.now() });
  if (history.length > 10) history = history.slice(0, 10);
  localStorage.setItem('url-history', JSON.stringify(history));
  renderHistory();
}

function renderHistory() {
  const el = $('history-list');
  if (!history.length) { el.innerHTML = '<p style="color:var(--muted);font-size:0.8rem;">None yet</p>'; return; }
  el.innerHTML = history.map(h => `
    <div class="history-item">
      <code>${h.code}</code> →
      <a href="/${h.code}" target="_blank">/${h.code}</a>
      <span style="color:var(--muted);margin-left:0.5rem;font-size:0.75rem;">${new URL(h.url).hostname}</span>
    </div>
  `).join('');
}

renderHistory();

// Enter key shortcuts
$('url').addEventListener('keydown', e => { if (e.key === 'Enter') $('shorten-btn').click(); });
$('stats-code').addEventListener('keydown', e => { if (e.key === 'Enter') $('stats-btn').click(); });
</script>
</body>
</html>
